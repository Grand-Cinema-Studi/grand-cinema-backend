version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A major version (EF Core 11, xUnit 4...) can need a new .NET version or code changes: done by hand, on purpose
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: "chore(deps)"