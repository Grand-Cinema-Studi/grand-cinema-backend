name: Deploy

on:
  push:
    branches: [dev] # every merge into dev updates the acceptance environment (Bloc 2)
  workflow_dispatch:

permissions: {} # nothing by default: each job asks for what it needs

concurrency:
  group: deploy-recette
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/grand-cinema-studi/grand-cinema-backend:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet test --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: recette
    permissions:
      contents: read
      id-token: write # OIDC token, exchanged for temporary AWS credentials
      packages: write # publish the image to GitHub Container Registry
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on the server
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SCRIPT_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy/deploy.sh
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --parameters "{\"commands\":[\"curl --proto '=https' --tlsv1.2 -fsSL $SCRIPT_URL -o /tmp/deploy.sh\",\"bash /tmp/deploy.sh $GITHUB_SHA\"]}" \
            --query Command.CommandId --output text)

          # Wait up to 10 minutes: pulling the images for the first time can be long
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "[StandardOutputContent, StandardErrorContent]" --output text
                exit 1 ;;
            esac
            sleep 5
          done
          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::The deployment did not finish within 10 minutes (last status: $STATUS)."
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text

      - name: Check the API through CloudFront
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$API_URL/health"
