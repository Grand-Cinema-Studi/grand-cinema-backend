name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud compares with the history to find the new code

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4 # the SonarScanner for .NET needs Java 17 or later
        with:
          distribution: temurin
          java-version: 17

      - run: dotnet restore
      # Before the SonarCloud analysis: dotnet format must only check the rules of the project, not the analysers added by the scanner
      - run: dotnet format --verify-no-changes --no-restore

      - name: Install the SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin the SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"Grand-Cinema-Studi_grand-cinema-backend"
          /o:"grand-cinema-studi"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.qualitygate.wait=true
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/Migrations/**,**/*.sql"
          /d:sonar.coverage.exclusions="**/Program.cs,**/Migrations/**,**/Persistence/Configurations/**,**/DependencyInjection.cs"

      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: End the SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
